<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Victoria Retail</title>
<style>html,body{margin:0;height:100%;background:#EDF0F3;font-family:system-ui,sans-serif;color:#223}.s{display:grid;place-items:center;height:100%;font-size:16px}</style></head>
<body><div class="s">Načítám…</div>
<script>
(function(){
  var BASE='https://thunderous-beijinho-84fdf4.netlify.app/',BUNDLED=1795033342;
  function idb(){return new Promise(function(res,rej){try{var r=indexedDB.open('vr-app',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};}catch(e){rej(e);}});}
  function get(k){return idb().then(function(db){return new Promise(function(res){var q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=function(){res(q.result||null);};q.onerror=function(){res(null);};});}).catch(function(){return null;});}
  function set(k,v){return idb().then(function(db){return new Promise(function(res,rej){var tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=function(){rej(tx.error);};});});}
  function ok(h){return typeof h==='string'&&h.length>200000&&h.indexOf('</html>')>-1&&h.indexOf('VR_CFG')>-1;}
  window.vrUpdate=function(){
    fetch(BASE+'version.json?'+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
      if(!j||!j.b)return;
      return get('html').then(function(st){
        var cur=Math.max(BUNDLED,(st&&st.b)||0);
        if(j.b<=cur)return;
        return fetch(BASE+'index.html?'+j.b,{cache:'no-store'}).then(function(r){return r.text();}).then(function(h){
          if(!ok(h))return;
          return set('html',{b:j.b,html:h}).then(function(){vrBanner();});
        });
      });
    }).catch(function(){});
  };
  function vrBanner(){
    if(document.getElementById('vrUpd'))return;
    var d=document.createElement('div');d.id='vrUpd';
    d.style.cssText='position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:99999;background:#1C2B5E;color:#fff;border-radius:14px;padding:12px 16px;font:15px system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.3);display:flex;gap:12px;align-items:center;max-width:92vw';
    d.innerHTML='<span>Je připravená nová verze aplikace.</span><button type="button" style="border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;background:#fff;color:#1C2B5E;min-height:44px">Použít teď</button><button type="button" aria-label="Později" style="border:0;background:none;color:#fff;font-size:20px;min-height:44px;padding:0 6px">×</button>';
    var b=d.getElementsByTagName('button');
    b[0].onclick=function(){location.reload();};b[1].onclick=function(){d.remove();};
    document.body.appendChild(d);
  }
  function boot(h){document.open();document.write(h);document.close();}
  function bundled(){return fetch('app.html').then(function(r){return r.text();});}
  get('html').then(function(st){
    if(st&&st.b>BUNDLED&&ok(st.html))return boot(st.html);
    return bundled().then(boot);
  }).catch(function(){bundled().then(boot);});
})();
</script></body></html>
